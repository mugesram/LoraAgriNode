; LoRa gateway: Seeed XIAO ESP32S3 + Wio-SX1262 kit.
; Receives the packets of the STM32L432 logger nodes, acknowledges them with
; the current time, and passes them to the server on the laptop over USB serial.
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  jgromes/RadioLib@^7.1.2
